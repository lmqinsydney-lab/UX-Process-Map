<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>链路画布 FlowCraft · Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Pulse Nights: Inter 正文 · Archivo 重体大写标题 · JetBrains Mono 追踪标签 -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Archivo:wght@700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  /* ═══════════════════════════════════════════════════════════════════════
     设计令牌 · "Pulse Nights" 赛博霓虹（对齐 DesignOS / 元创）
     黑紫画布被品红 + 青 + 紫的激光雾洗过，白色墨水，酸性青柠作为动作色，
     锐角（2–8px）、Archivo 重体大写标题、JetBrains Mono 追踪标签、扫描线与 HUD 角标。
     ═══════════════════════════════════════════════════════════════════════ */
  :root{
    --bg-grad:
      radial-gradient(ellipse 85% 60% at 50% -12%, rgba(255,46,196,.20) 0%, transparent 55%),
      radial-gradient(ellipse 75% 60% at 88% 14%, rgba(38,230,242,.12) 0%, transparent 55%),
      radial-gradient(ellipse 65% 55% at 8% 96%, rgba(150,50,255,.14) 0%, transparent 55%),
      #070510;
    --bg:#070510;
    --line:rgba(255,255,255,.09);          /* 发丝线 */
    --line-strong:rgba(255,255,255,.17);
    --tx:#F5F1FA;                          /* 主墨 */
    --tx2:#A39FB8;                         /* 次级 */
    --tx3:#6E6A85;                         /* 弱化 */
    --tx4:#484560;                         /* 极弱 */
    --brand:#C6FF00;                       /* 酸性青柠 · 动作色 */
    --brand2:#D6FF4D;
    --on-primary:#0A0A0A;                  /* 青柠上的深色字 */
    --magenta:#FF2EC4;
    --cyan:#26E6F2;
    --purple:#9D4BFF;
    --primary-c:rgba(198,255,0,.12);       /* 青柠容器 */
    --on-primary-c:#D6FF4D;
    --secondary-c:rgba(157,75,255,.20);    /* 紫容器 */
    --on-secondary-c:#CFB4FF;
    --surface:#0F0C1A;                     /* 抬升的紫黑面 */
    --surface-c:#0B0817;
    --surface-ch:#171326;
    --surface-active:#221B3A;
    --inverse:#F5F1FA;
    --inverse-on:#15121F;
    --error:#E5736B;
    --r-sm:2px; --r-md:3px; --r-lg:5px; --r-xl:8px;
    --ele1:0 1px 2px rgba(0,0,0,.45);
    --ele2:0 6px 24px rgba(0,0,0,.55);
    --ele3:0 16px 48px rgba(120,10,90,.35), 0 16px 48px rgba(0,0,0,.55);
  }
  html,body{ height:100%; overflow:hidden; }
  html{ background:#070510; color-scheme:dark; }
  body{
    font-family:Inter,-apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI","Helvetica Neue",sans-serif;
    color:var(--tx); background:var(--bg-grad); font-size:14px; line-height:1.5;
  }
  *{ scrollbar-width:none; -ms-overflow-style:none; }
  *::-webkit-scrollbar{ width:0; height:0; display:none; }
  .mi{ vertical-align:middle; flex-shrink:0; display:inline-block; }
  .ic{ line-height:0; display:inline-flex; }
  button{ font-family:inherit; }
  button:focus{ outline:none; }
  button:focus-visible{ outline:1px solid rgba(198,255,0,.85); outline-offset:2px; }

  /* ── 排版工具 ───────────────────────────────────────────────────────── */
  /* Archivo 重体大写标题 —— "PULSE NIGHTS" 那种感觉 */
  .display{ font-family:Archivo,-apple-system,"PingFang SC",sans-serif; font-weight:800; letter-spacing:-.01em; line-height:.92; text-transform:uppercase; }
  /* Mono 追踪标签 —— 眉标 / 计数器 */
  .label-mono{ font-family:"JetBrains Mono","SF Mono",Menlo,monospace; text-transform:uppercase; letter-spacing:.2em; font-size:11px; font-weight:500; color:var(--tx3); }
  .num-mono{ font-family:"JetBrains Mono","SF Mono",Menlo,monospace; font-feature-settings:"tnum"; }
  /* 霓虹渐变文字（品红 → 紫 → 青，叠 CRT 扫描带） */
  .neon-grad{
    background:
      repeating-linear-gradient(0deg, rgba(0,0,0,.55) 0, rgba(0,0,0,.55) 2px, transparent 2px, transparent 5px),
      linear-gradient(178deg,#FF2EC4 0%,#C04BFF 46%,#26E6F2 100%);
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; color:transparent;
  }

  /* ── 赛博组件工具 ──────────────────────────────────────────────────── */
  /* 亮底上的 CRT 暗扫描线（青柠按钮） */
  .scanlines{ position:relative; isolation:isolate; overflow:hidden; }
  .scanlines::before{
    content:""; position:absolute; inset:0; pointer-events:none; z-index:1; border-radius:inherit;
    background:repeating-linear-gradient(0deg, rgba(0,0,0,.26) 0, rgba(0,0,0,.26) 1px, transparent 1px, transparent 3px);
  }
  /* 暗面上的极淡白扫描线（卡片、面板） */
  .scanlines-soft{ position:relative; }
  .scanlines-soft::before{
    content:""; position:absolute; inset:0; pointer-events:none; z-index:0; border-radius:inherit;
    background:repeating-linear-gradient(0deg, rgba(255,255,255,.022) 0, rgba(255,255,255,.022) 1px, transparent 1px, transparent 4px);
  }
  /* HUD 角标 —— 卡片左上 / 右下的霓虹 L 括号 */
  .hud{ position:relative; }
  .hud::before,.hud::after{
    content:""; position:absolute; width:11px; height:11px; pointer-events:none; z-index:5;
    border-color:var(--hud-c,var(--cyan)); opacity:.5; transition:opacity .15s;
  }
  .hud::before{ top:0; left:0; border-top:1px solid; border-left:1px solid; }
  .hud::after{ bottom:0; right:0; border-bottom:1px solid; border-right:1px solid; }
  .hud:hover::before,.hud:hover::after{ opacity:1; }
  /* 品牌球 —— 旋转的全光谱锥形渐变 + 扫描线 + 高光 */
  .brand-orb{ position:relative; display:inline-block; flex-shrink:0; border-radius:50%; overflow:hidden;
    box-shadow:0 0 9px rgba(157,75,255,.5), inset 0 0 6px rgba(0,0,0,.45); }
  .brand-orb::before{ content:""; position:absolute; inset:-30%;
    background:conic-gradient(from 0deg,#FF2EC4,#9D4BFF,#5B6CFF,#26E6F2,#38F5A0,#E8FF3D,#FF9A3D,#FF2EC4);
    animation:orb-spin 7s linear infinite; }
  .brand-orb::after{ content:""; position:absolute; inset:0; border-radius:50%;
    background:
      repeating-linear-gradient(0deg, rgba(0,0,0,.34) 0, rgba(0,0,0,.34) 1px, transparent 1px, transparent 3px),
      radial-gradient(circle at 34% 28%, rgba(255,255,255,.55) 0, transparent 40%),
      radial-gradient(circle at 50% 50%, transparent 52%, rgba(0,0,0,.55) 100%); }
  @keyframes orb-spin{ to{ transform:rotate(360deg); } }
  @media (prefers-reduced-motion: reduce){ .brand-orb::before{ animation:none; } }

  /* ========== 顶部栏 ========== */
  header{
    height:64px; background:rgba(11,8,23,.72); backdrop-filter:blur(14px); border-bottom:1px solid var(--line);
    display:flex; align-items:center; gap:14px; padding:0 20px; position:relative; z-index:30;
  }
  .logo{ display:flex; align-items:center; gap:10px; flex-shrink:0; }
  .logo .mark{ width:28px; height:28px; }
  .logo b{ font-family:Archivo,-apple-system,"PingFang SC",sans-serif; font-size:16px; font-weight:800; letter-spacing:.03em; }
  .logo .tag{ font-family:"JetBrains Mono","SF Mono",Menlo,monospace; font-size:10px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--on-secondary-c); background:var(--secondary-c); border:1px solid rgba(157,75,255,.32);
    padding:3px 8px; border-radius:var(--r-md); font-weight:500; }

  /* 分段控件 —— HUD 方角 */
  .seg{ display:flex; border:1px solid var(--line-strong); border-radius:var(--r-md); overflow:hidden; flex-shrink:0; height:36px; background:rgba(255,255,255,.02); }
  .seg button{ border:0; background:transparent; padding:0 15px; font-size:13px; color:var(--tx2); cursor:pointer; transition:.15s; white-space:nowrap; display:flex; align-items:center; gap:7px; }
  .seg button + button{ border-left:1px solid var(--line); }
  .seg button:hover{ background:var(--surface-ch); color:var(--tx); }
  .seg button .ic{ display:none; line-height:0; }
  .seg button.on{ background:var(--surface-active); color:var(--brand); font-weight:600; box-shadow:inset 0 -2px 0 var(--brand); }
  .seg button.on .ic{ display:inline-flex; }

  .prompt-wrap{ flex:1; display:flex; gap:10px; max-width:720px; min-width:170px; }
  .prompt-wrap input{
    flex:1; min-width:0; height:36px; border:1px solid var(--line-strong); border-radius:var(--r-md); padding:0 13px;
    font-size:13px; outline:none; background:rgba(255,255,255,.02); transition:.15s; color:var(--tx);
  }
  .prompt-wrap input::placeholder{ color:var(--tx3); }
  .prompt-wrap input:focus{ border-color:var(--brand); background:rgba(198,255,0,.04); }
  /* 主行动按钮 —— 酸性青柠 + 扫描线 + 外发光 */
  .btn-gen{
    position:relative; isolation:isolate; overflow:hidden;
    height:36px; padding:0 18px; border:0; border-radius:var(--r-md); cursor:pointer; flex-shrink:0; white-space:nowrap;
    background:var(--brand); color:var(--on-primary); font-size:13px; font-weight:700; letter-spacing:.01em;
    display:flex; align-items:center; gap:8px; transition:.15s;
    box-shadow:0 8px 18px -4px rgba(198,255,0,.45), 0 0 18px rgba(198,255,0,.25);
  }
  .btn-gen::before{ content:""; position:absolute; inset:0; pointer-events:none; z-index:1; border-radius:inherit;
    background:repeating-linear-gradient(0deg, rgba(0,0,0,.26) 0, rgba(0,0,0,.26) 1px, transparent 1px, transparent 3px); }
  .btn-gen:hover{ background:var(--brand2); box-shadow:0 10px 24px -4px rgba(198,255,0,.6), 0 0 26px rgba(198,255,0,.45); }
  .btn-gen:disabled{ background:var(--surface-active); color:var(--tx4); box-shadow:none; cursor:not-allowed; }
  .btn-gen:disabled::before{ opacity:0; }
  /* 描边按钮 */
  .btn-prd{
    height:36px; padding:0 16px; border:1px solid var(--line-strong); border-radius:var(--r-md); background:rgba(255,255,255,.02);
    cursor:pointer; font-size:13px; color:var(--tx2); flex-shrink:0; font-weight:600; display:flex; align-items:center; gap:8px; transition:.15s;
  }
  .btn-prd:hover{ border-color:var(--cyan); color:var(--tx); box-shadow:0 0 20px -8px var(--cyan); }

  /* ========== 画布 ========== */
  #stage{ position:absolute; top:64px; left:0; right:0; bottom:0; overflow:hidden; cursor:grab;
    background-image:radial-gradient(circle, rgba(255,255,255,.075) 1.2px, transparent 1.2px);
  }
  #stage.panning{ cursor:grabbing; }
  #world{ position:absolute; top:0; left:0; transform-origin:0 0; }
  #edgeSvg{ position:absolute; top:0; left:0; overflow:visible; pointer-events:none; }
  #edgeSvg path{ fill:none; stroke:rgba(157,75,255,.55); stroke-width:2; }
  #edgeSvg text{ font-family:"JetBrains Mono","SF Mono",Menlo,monospace; font-size:10px; letter-spacing:.06em; fill:var(--tx2);
    paint-order:stroke; stroke:#070510; stroke-width:4px; font-weight:500; }

  /* 节点 —— 暗紫黑卡 + 淡扫描线 + HUD 角标 */
  .node{
    position:absolute; width:208px; border:1px solid var(--line); border-radius:var(--r-lg);
    background:
      repeating-linear-gradient(0deg, rgba(255,255,255,.022) 0, rgba(255,255,255,.022) 1px, transparent 1px, transparent 4px),
      var(--surface);
    padding:12px 14px; cursor:pointer; user-select:none;
    box-shadow:var(--ele1);
    transition:box-shadow .16s, border-color .16s, transform .16s;
  }
  .node::before,.node::after{
    content:""; position:absolute; width:10px; height:10px; pointer-events:none; z-index:5;
    border-color:var(--c,var(--cyan)); opacity:.45; transition:opacity .15s;
  }
  .node::before{ top:0; left:0; border-top:1px solid; border-left:1px solid; }
  .node::after{ bottom:0; right:0; border-bottom:1px solid; border-right:1px solid; }
  .node.anim{ animation:pop .4s cubic-bezier(.2,1.2,.4,1) both; animation-delay:var(--d,0s); }
  @keyframes pop{ from{ opacity:0; transform:scale(.7) translateY(10px);} to{ opacity:1; transform:scale(1);} }
  .node:hover{ border-color:var(--c,var(--cyan)); box-shadow:0 0 26px -8px var(--c,var(--cyan)), var(--ele2); transform:translateY(-2px); }
  .node:hover::before,.node:hover::after{ opacity:1; }
  .node.selected{ border-color:var(--c,var(--cyan)); box-shadow:inset 0 0 0 1px var(--c,var(--cyan)), 0 0 34px -8px var(--c,var(--cyan)), var(--ele2); }
  .node.selected::before,.node.selected::after{ opacity:1; }
  .n-head{ display:flex; align-items:center; gap:6px; margin-bottom:7px; }
  .n-dot{ width:7px; height:7px; border-radius:1px; background:var(--c,var(--cyan)); box-shadow:0 0 8px var(--c,var(--cyan)); }
  .n-type{ font-family:"JetBrains Mono","SF Mono",Menlo,monospace; font-size:9.5px; letter-spacing:.18em; text-transform:uppercase; color:var(--tx3); font-weight:500; }
  .n-status{ margin-left:auto; font-family:"JetBrains Mono","SF Mono",Menlo,monospace; font-size:9px; letter-spacing:.1em; text-transform:uppercase;
    color:var(--brand); background:rgba(198,255,0,.10); border:1px solid rgba(198,255,0,.30);
    padding:2px 7px; border-radius:var(--r-sm); font-weight:500; display:none; align-items:center; gap:3px; }
  .node.hasPage .n-status{ display:inline-flex; }
  .n-title{ font-size:14px; font-weight:700; line-height:1.35; color:var(--tx); }
  .n-desc{ font-size:11.5px; color:var(--tx2); margin-top:4px; line-height:1.5; }
  /* 节点内 1:1 完整展示已生成页面：不缩放、不裁切，高度随内容生长，无需点击查看 */
  .node.hasPage{ width:auto; }
  .n-page{ display:none; margin-top:10px; pointer-events:none; }
  .node.hasPage .n-page{ display:block; }
  .n-page .fr{ width:320px; border:1px solid var(--line-strong); border-radius:var(--r-lg); overflow:hidden; background:#F5F7FA; }
  .n-page .fr.b{ width:560px; }
  .n-page .fr .pg{ height:auto; min-height:540px; }
  .n-page .fr.b .pg{ min-height:460px; }
  .n-page .fr .bbody{ overflow:visible; }
  .n-page .fr .dscreen{ height:auto; }

  /* 节点类型色 —— 霓虹光谱 */
  .node.t-start{ --c:#38F5A0; border-left:2px solid #38F5A0; }
  .node.t-page{  --c:#26E6F2; border-left:2px solid #26E6F2; }
  .node.t-branch{ --c:#FF9A3D; border-left:2px solid #FF9A3D; }
  .node.t-branch .n-dot{ transform:rotate(45deg); }
  .node.t-modal{ --c:#FF2EC4; border-left:2px solid #FF2EC4; }
  .node.t-end{   --c:#6E6A85; border-left:2px solid #6E6A85; }

  /* 空状态 */
  #empty{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; pointer-events:none; }
  #empty .big{ color:var(--purple); line-height:0; filter:drop-shadow(0 0 18px rgba(157,75,255,.55)); }
  #empty h2{ font-family:Archivo,-apple-system,"PingFang SC",sans-serif; font-size:26px; font-weight:800; letter-spacing:-.01em;
    background:
      repeating-linear-gradient(0deg, rgba(0,0,0,.45) 0, rgba(0,0,0,.45) 2px, transparent 2px, transparent 5px),
      linear-gradient(178deg,#FF2EC4 0%,#C04BFF 46%,#26E6F2 100%);
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; color:transparent; }
  #empty p{ font-size:13px; color:var(--tx2); }
  #empty .chips{ display:flex; gap:10px; margin-top:10px; pointer-events:auto; flex-wrap:wrap; justify-content:center; }
  /* 芯片 —— 方角 HUD */
  .chip{ border:1px solid var(--line-strong); background:rgba(255,255,255,.02); height:32px; padding:0 14px; border-radius:var(--r-md);
    font-size:12.5px; cursor:pointer; color:var(--tx2); transition:.15s; display:inline-flex; align-items:center; gap:8px; }
  .chip .ic{ color:var(--cyan); line-height:0; }
  .chip:hover{ background:var(--surface-ch); color:var(--tx); border-color:var(--cyan); box-shadow:0 0 20px -8px var(--cyan); }

  /* 画布工具 */
  #tools{ position:absolute; left:18px; bottom:18px; display:flex; align-items:center; gap:2px;
    background:rgba(15,12,26,.86); backdrop-filter:blur(10px); border:1px solid var(--line); border-radius:var(--r-lg);
    padding:4px 6px; box-shadow:var(--ele2); z-index:20; }
  #tools button{ width:32px; height:32px; border:0; background:transparent; border-radius:var(--r-sm); cursor:pointer; color:var(--tx3); display:flex; align-items:center; justify-content:center; transition:.15s; }
  #tools button:hover{ background:var(--surface-ch); color:var(--brand); }
  #tools .pct{ font-family:"JetBrains Mono","SF Mono",Menlo,monospace; font-size:11px; color:var(--tx2); width:48px; text-align:center; font-weight:500; }
  #legend{ position:absolute; right:18px; bottom:18px; display:flex; gap:12px;
    background:rgba(15,12,26,.86); backdrop-filter:blur(10px); border:1px solid var(--line); border-radius:var(--r-lg);
    padding:9px 14px; font-family:"JetBrains Mono","SF Mono",Menlo,monospace; font-size:10px; letter-spacing:.1em; text-transform:uppercase;
    color:var(--tx2); z-index:20; box-shadow:var(--ele2); }
  #legend i{ width:7px; height:7px; border-radius:1px; display:inline-block; margin-right:6px; }

  /* 生成中遮罩 */
  #genMask{ position:absolute; inset:0; background:rgba(7,5,16,.78); backdrop-filter:blur(4px); display:none; align-items:center; justify-content:center; z-index:25; }
  #genMask.show{ display:flex; }
  .gen-card{ position:relative; background:var(--surface); border:1px solid var(--line-strong); border-radius:var(--r-xl);
    padding:30px 44px; box-shadow:var(--ele3); text-align:center; }
  .gen-card::before,.gen-card::after{ content:""; position:absolute; width:12px; height:12px; border-color:var(--cyan); opacity:.6; }
  .gen-card::before{ top:0; left:0; border-top:1px solid; border-left:1px solid; }
  .gen-card::after{ bottom:0; right:0; border-bottom:1px solid; border-right:1px solid; }
  .spinner{ width:36px; height:36px; border:3px solid rgba(245,241,250,.16); border-top-color:var(--brand); border-radius:50%; margin:0 auto 14px; animation:spin .8s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg);} }
  .gen-card .st{ font-family:"JetBrains Mono","SF Mono",Menlo,monospace; font-size:11.5px; letter-spacing:.1em; color:var(--tx2); min-height:20px; }

  /* ========== 右侧抽屉 ========== */
  #drawer{
    position:absolute; top:64px; right:0; bottom:0; width:820px; max-width:92vw;
    background:linear-gradient(180deg, rgba(15,12,26,.98), rgba(11,8,23,.98));
    border-left:1px solid var(--line-strong); box-shadow:-16px 0 48px rgba(0,0,0,.55);
    transform:translateX(105%); transition:transform .3s cubic-bezier(.3,1,.4,1); z-index:40;
    display:flex; flex-direction:column;
  }
  #drawer.open{ transform:translateX(0); }
  .d-head{ height:56px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px; padding:0 20px; flex-shrink:0; }
  .d-head .n-dot{ width:8px; height:8px; border-radius:1px; }
  .d-head b{ font-family:Archivo,-apple-system,"PingFang SC",sans-serif; font-size:15px; font-weight:800; letter-spacing:.01em; }
  .d-head .tp{ font-family:"JetBrains Mono","SF Mono",Menlo,monospace; font-size:9.5px; letter-spacing:.16em; text-transform:uppercase;
    color:var(--on-secondary-c); background:var(--secondary-c); border:1px solid rgba(157,75,255,.32); padding:3px 8px; border-radius:var(--r-sm); font-weight:500; }
  .d-close{ margin-left:auto; width:32px; height:32px; border:0; background:transparent; border-radius:var(--r-sm); cursor:pointer; color:var(--tx3); display:flex; align-items:center; justify-content:center; transition:.15s; }
  .d-close:hover{ background:var(--surface-ch); color:var(--tx); }
  .d-body{ flex:1; display:flex; min-height:0; }

  /* 对话列 */
  .chat-col{ flex:1; display:flex; flex-direction:column; min-width:0; border-right:1px solid var(--line); }
  .chat-scroll{ flex:1; overflow-y:auto; padding:18px; display:flex; flex-direction:column; gap:14px; }
  .msg{ display:flex; gap:9px; max-width:100%; animation:msgIn .25s ease both; }
  @keyframes msgIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1;} }
  .msg .ava{ width:30px; height:30px; border-radius:var(--r-md); flex-shrink:0; display:flex; align-items:center; justify-content:center; }
  .msg.ai .ava{ background:linear-gradient(135deg,var(--magenta),var(--cyan)); color:#0A0A0A; }
  .msg.me{ flex-direction:row-reverse; }
  .msg.me .ava{ background:linear-gradient(135deg,var(--magenta),var(--purple)); color:#fff; }

  /* 配置选择器 */

  .bbody{ flex:1; padding:10px 12px; overflow-y:auto; min-width:0; }

  .bf-btn.primary{ background:var(--p); border-color:var(--p); color:#fff; font-weight:600; }
  .btable{ background:#fff; border:1px solid #E3E7EF; border-radius:9px; overflow:hidden; margin-bottom:10px; }
  .bt-row{ display:flex; border-bottom:1px solid #F2F4F8; }

  .modal{ position:fixed; inset:0; background:rgba(7,5,16,.72); backdrop-filter:blur(4px); display:none; align-items:center; justify-content:center; z-index:60; }

  .save-input{ width:100%; height:42px; border:1px solid var(--line-strong); border-radius:var(--r-md); padding:0 14px; font-size:13px; outline:none; background:rgba(255,255,255,.02); color:var(--tx); transition:.15s; }
  .save-input:focus{ border-color:var(--brand); background:rgba(198,255,0,.04); }

  /* ========== 弹窗 ========== */
  #prdModal{ position:fixed; inset:0; background:rgba(7,5,16,.72); backdrop-filter:blur(4px); display:none; align-items:center; justify-content:center; z-index:60; }

<body>

<header>
  <div class="logo">
    <div class="mark brand-orb" role="img" aria-label="链路画布"></div>
    <b>链路画布</b>
    <span class="tag">Demo</span>
  </div>
  <div class="seg">
    <button id="modeOne" class="on"><span class="ic" data-mi="check" data-size="15"></span>一句话生成</button>
    <button id="modePrd"><span class="ic" data-mi="check" data-size="15"></span>PRD 分析</button>
  </div>

/* ============================================================
   画布：渲染 / 布局 / 平移缩放
============================================================ */
const stage = document.getElementById('stage');
const world = document.getElementById('world');
const nodeLayer = document.getElementById('nodeLayer');
const edgeSvg = document.getElementById('edgeSvg');

function layoutFlow(flow){
  // 分层：依赖最长路径
  const depth = {}, indeg = {};
  flow.nodes.forEach(n => { depth[n.id] = 0; indeg[n.id] = 0; });
  flow.edges.forEach(e => indeg[e.to]++);
  // 迭代松弛（简单 DAG 分层，容忍回边）
  for (let i = 0; i < flow.nodes.length; i++){
    flow.edges.forEach(e => {
      if (depth[e.from] + 1 > depth[e.to] && depth[e.from] < flow.nodes.length) {
        // 跳过明显的回边（to 的入度为多且已有更小深度且 from 深度较大时的循环）
        if (depth[e.to] <= depth[e.from]) depth[e.to] = Math.min(depth[e.from] + 1, flow.nodes.length);
      }
    });
  }
  // 只定分层，真正的坐标交给 relayout() 按节点实测尺寸算
  flow.nodes.forEach(n => n.depth = depth[n.id]);
}

function renderFlow(animate){
  nodeLayer.innerHTML = '';
  if (!state.flow) return;
  state.flow.nodes.forEach((n, i) => {
    const el = document.createElement('div');
    el.className = `node t-${n.type}` + (animate ? ' anim' : '') + (state.pages[n.id] ? ' hasPage' : '') + (state.selectedId === n.id ? ' selected' : '');
    el.style.left = n.x + 'px';
    el.style.top = n.y + 'px';
    el.style.setProperty('--d', (i * 0.06) + 's');
    el.dataset.id = n.id;
    el.innerHTML = `
      <div class="n-head"><span class="n-dot"></span><span class="n-type">${TYPE_NAME[n.type]}</span><span class="n-status">${mi('check', 10)}已生成页面</span></div>
      <div class="n-title">${n.title}</div>
      <div class="n-desc">${n.desc || ''}</div>
      <div class="n-page">${state.pages[n.id] ? nodePageHTML(state.pages[n.id]) : ''}</div>`;
    bindNodeEvents(el, n);
    nodeLayer.appendChild(el);
  });
  relayout();
  requestAnimationFrame(drawEdges);
}

/* 节点里的页面：1:1 原尺寸整页渲染（画布内直接看全，不再点开弹窗） */
function nodePageHTML(spec){
  if (spec.mode === 'b'){
    return `<div class="fr b"><div class="dbar"><i></i><i></i><i></i><span class="durl">ops.didi.cn/console</span></div>${renderPageBody(spec, false)}</div>`;
  }
  return `<div class="fr">${renderPageBody(spec, false)}</div>`;
}

/* 按节点真实尺寸重排：列宽/行高都取实测值，页面变大也不会互相压盖 */
function relayout(){
  if (!state.flow) return;
  layoutFlow(state.flow);
  const els = {};
  nodeLayer.querySelectorAll('.node').forEach(el => els[el.dataset.id] = el);
  const cols = {};
  state.flow.nodes.forEach(n => { (cols[n.depth] = cols[n.depth] || []).push(n); });
  let cx = 60;
  Object.keys(cols).map(Number).sort((a, b) => a - b).forEach(d => {
    const arr = cols[d];
    const sz = arr.map(n => { const el = els[n.id]; return { w: el ? el.offsetWidth : NODE_W, h: el ? el.offsetHeight : 90 }; });
    const colW = Math.max(...sz.map(s => s.w));
    const totalH = sz.reduce((a, s) => a + s.h, 0) + ROW_GAP * (arr.length - 1);
    let y = -totalH / 2;
    arr.forEach((n, i) => {
      n.w = sz[i].w; n.h = sz[i].h;
      n.bx = cx + (colW - sz[i].w) / 2;
      n.by = y;
      n.x = n.bx + (n.dx || 0);          // 保留手动拖拽的偏移
      n.y = n.by + (n.dy || 0);
      y += sz[i].h + ROW_GAP;
      const el = els[n.id];
      if (el){ el.style.left = n.x + 'px'; el.style.top = n.y + 'px'; }
    });
    cx += colW + COL_GAP;
  });
}

function drawEdges(){
  if (!state.flow) { edgeSvg.innerHTML = ''; return; }
  const sizes = {};
  nodeLayer.querySelectorAll('.node').forEach(el => { sizes[el.dataset.id] = { w: el.offsetWidth, h: el.offsetHeight }; });
  const byId = {};
  state.flow.nodes.forEach(n => byId[n.id] = n);
  let html = `<defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M1,1 L8,4.5 L1,8" fill="none" stroke="rgba(157,75,255,.75)" stroke-width="1.6" stroke-linecap="round"/></marker></defs>`;
  state.flow.edges.forEach(e => {
    const a = byId[e.from], b = byId[e.to];
    if (!a || !b) return;
    const sa = sizes[a.id] || { w: NODE_W, h: 90 }, sb = sizes[b.id] || { w: NODE_W, h: 90 };
    let x1, y1, x2, y2;
    if (b.x >= a.x + sa.w - 20) { // 正向：右出左入
      x1 = a.x + sa.w; y1 = a.y + sa.h / 2; x2 = b.x; y2 = b.y + sb.h / 2;
    } else { // 回边：左出右入
      x1 = a.x; y1 = a.y + sa.h / 2; x2 = b.x + sb.w; y2 = b.y + sb.h / 2;
    }
    const dx = Math.max(46, Math.abs(x2 - x1) / 2) * (x2 >= x1 ? 1 : -1);
    html += `<path d="M${x1},${y1} C${x1 + dx},${y1} ${x2 - dx},${y2} ${x2},${y2}" marker-end="url(#arr)"/>`;
    if (e.label) html += `<text x="${(x1 + x2) / 2}" y="${(y1 + y2) / 2 - 7}" text-anchor="middle">${e.label}</text>`;
  });
  edgeSvg.innerHTML = html;
}

function applyTransform(){
  world.style.transform = `translate(${state.pan.x}px, ${state.pan.y}px) scale(${state.scale})`;
  stage.style.backgroundPosition = `${state.pan.x}px ${state.pan.y}px`;
  stage.style.backgroundSize = `${26 * state.scale}px ${26 * state.scale}px`;
  document.getElementById('zoomPct').textContent = Math.round(state.scale * 100) + '%';
}

function fitView(){
  if (!state.flow || !state.flow.nodes.length) return;
  const ns = state.flow.nodes;
  const minX = Math.min(...ns.map(n => n.x)) - 60;
  const minY = Math.min(...ns.map(n => n.y)) - 60;
  const maxX = Math.max(...ns.map(n => n.x + (n.w || NODE_W))) + 60;
  const maxY = Math.max(...ns.map(n => n.y + (n.h || 90))) + 60;
  const vw = stage.clientWidth || window.innerWidth || 1280;
  const vh = stage.clientHeight || Math.max(300, (window.innerHeight || 800) - 60);
  const s = Math.min(vw / (maxX - minX), vh / (maxY - minY), 1);
  state.scale = Math.max(0.08, s);
  state.pan.x = (vw - (maxX - minX) * state.scale) / 2 - minX * state.scale;
  state.pan.y = (vh - (maxY - minY) * state.scale) / 2 - minY * state.scale;
  applyTransform();
}

/* 平移 */
let panDrag = null;
stage.addEventListener('mousedown', e => {
  if (e.target.closest('.node') || e.target.closest('#tools') || e.target.closest('#legend') || e.target.closest('.chips')) return;
  panDrag = { sx: e.clientX, sy: e.clientY, px: state.pan.x, py: state.pan.y };
  stage.classList.add('panning');
  closeDrawer();
});
window.addEventListener('mousemove', e => {
  if (panDrag) {
    state.pan.x = panDrag.px + e.clientX - panDrag.sx;
    state.pan.y = panDrag.py + e.clientY - panDrag.sy;
    applyTransform();
  }
  if (nodeDrag) {
    const n = nodeDrag.node;
    n.x = nodeDrag.nx + (e.clientX - nodeDrag.sx) / state.scale;
    n.y = nodeDrag.ny + (e.clientY - nodeDrag.sy) / state.scale;
    n.dx = n.x - (n.bx || 0); n.dy = n.y - (n.by || 0);
    nodeDrag.el.style.left = n.x + 'px';
    nodeDrag.el.style.top = n.y + 'px';
    nodeDrag.moved = nodeDrag.moved || Math.hypot(e.clientX - nodeDrag.sx, e.clientY - nodeDrag.sy) > 4;
    drawEdges();
  }
});
window.addEventListener('mouseup', () => { panDrag = null; stage.classList.remove('panning'); });

/* 缩放 */
stage.addEventListener('wheel', e => {
  e.preventDefault();
  const rect = stage.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  const factor = e.deltaY < 0 ? 1.1 : 1 / 1.1;
  const ns = Math.min(2, Math.max(0.08, state.scale * factor));
  state.pan.x = mx - (mx - state.pan.x) * (ns / state.scale);
  state.pan.y = my - (my - state.pan.y) * (ns / state.scale);
  state.scale = ns;
  applyTransform();
}, { passive: false });

document.getElementById('zoomIn').onclick = () => { state.scale = Math.min(2, state.scale * 1.2); applyTransform(); };
document.getElementById('zoomOut').onclick = () => { state.scale = Math.max(0.08, state.scale / 1.2); applyTransform(); };
document.getElementById('zoomFit').onclick = fitView;

/* 节点拖拽 & 点击 */
let nodeDrag = null;
function bindNodeEvents(el, n){
  el.addEventListener('mousedown', e => {
    e.stopPropagation();
    nodeDrag = { node: n, el, sx: e.clientX, sy: e.clientY, nx: n.x, ny: n.y, moved: false };
  });
  el.addEventListener('mouseup', e => {
    if (nodeDrag && !nodeDrag.moved) selectNode(n.id);
    nodeDrag = null;
  });
}

async function generateFlow(prompt, fromPrd){
  if (state.busy) return;
  state.busy = true;
  document.getElementById('btnGen').disabled = true;
  genMask.classList.add('show');
  document.getElementById('empty').style.display = 'none';
  closeDrawer();

  const steps = fromPrd
    ? ['正在解析 PRD 文档…', '识别页面与流程关键词…', '构建节点关系图…', '自动布局中…']
    : ['正在理解需求…', '拆解用户旅程与关键场景…', '生成页面节点与分支…', '自动布局中…'];
  for (const s of steps){
    genStep.textContent = s;
    await wait(450);
  }

  let tpl;
  if (fromPrd) {
    tpl = parsePrd(prompt);
  } else {
    tpl = TEMPLATES.find(t => t.match.test(prompt));
    if (!tpl) {
      const topic = prompt.replace(/做一个|帮我做|设计|流程|的|一个|App|app/g, '').trim().slice(0, 6) || '产品';
      tpl = GENERIC_TEMPLATE(topic);
    }
  }

  // 深拷贝，避免污染模板
  state.flow = {
    nodes: tpl.nodes.map(n => ({ ...n })),
    edges: tpl.edges.map(e => ({ ...e })),
  };
  state.pages = {};
  state.chats = {};
  state.configs = {};
  state.descs = {};
  state.selectedId = null;
  state.flowName = tpl.name;

  layoutFlow(state.flow);
  genMask.classList.remove('show');
  renderFlow(true);
  fitView();
  toast(`已生成「${tpl.name}」：${state.flow.nodes.length} 个节点 · ${state.flow.edges.length} 条链路，点击节点可生成页面`);
  state.busy = false;
  document.getElementById('btnGen').disabled = false;
}

function parsePrd(text){
  const re = /([一-龥A-Za-z0-9]{1,12}?(?:页面|弹窗|浮层|收银台|首页|等待页|结果页|成功页|失败页|详情页|列表页|确认页|填写页|对比页|试算页|跟踪页|完成页|登录页|注册页|页))/g;
  const seen = new Set(), names = [];
  let m;
  while ((m = re.exec(text)) && names.length < 14){
    // 去掉动词性前缀：取最后一个连接词之后的部分作为页面名
    let name = m[1].split(/(?:从|后|时|若|则|即|且|并|可|直接|进入|停留在|跳转到?|随|先|再|接着|然后|将|会|需|击|自)/).pop();
    name = name.replace(/^(?:的|一个|新增|展示|打开|返回)+/, '');
    if (name.length < 2 || seen.has(name)) continue;
    // 与已有名称互为后缀的视为同一页面（如「收银台」vs「支付收银台」）
    if (names.some(n => n.endsWith(name) || name.endsWith(n))) continue;
    seen.add(name);
    names.push(name);
  }
  if (names.length < 3){
    const kw = TEMPLATES.find(t => t.match.test(text));
    if (kw) return kw;
    return GENERIC_TEMPLATE('产品');
  }
  const nodes = names.map((name, i) => {
    let type = 'page';
    if (i === 0) type = 'start';
    else if (/弹窗|浮层/.test(name)) type = 'modal';
    else if (i === names.length - 1) type = 'end';
    return T('p' + i, type, name, guessDesc(name));
  });
  const edges = [];
  for (let i = 0; i < nodes.length - 1; i++) edges.push(E(nodes[i].id, nodes[i + 1].id));
  return { name: 'PRD 解析结果', nodes, edges };
}

function guessDesc(name){
  if (/首页/.test(name)) return '流程入口页面';
  if (/报价|试算/.test(name)) return '输入信息获取报价';
  if (/对比|方案/.test(name)) return '多方案对比选择';
  if (/填写|信息/.test(name)) return '表单信息录入';
  if (/确认/.test(name)) return '信息核对与确认';
  if (/核保|审核|等待/.test(name)) return '审核进度展示';
  if (/收银|支付/.test(name)) return '支付方式选择与支付';
  if (/成功/.test(name)) return '操作成功反馈';
  if (/失败/.test(name)) return '失败原因与重试';
  if (/详情/.test(name)) return '完整信息展示';
  return '从 PRD 中识别的页面';
}

};
function dsIcon(k){ return k === 'none' ? ICONS.none : ICONS.ds(k === 'gone-c' ? '#FF6400' : null); }

function cfgOf(id){
  if (!state.configs[id]) state.configs[id] = { fw:'react', side:'c', ds:'gone-c', pt:'auto' };
  return state.configs[id];
}
function cfgSummary(cfg){
  const parts = [ FRAMEWORKS.find(f => f.k === cfg.fw).name, SIDES.find(s => s.k === cfg.side).name, DS_MAP[cfg.ds].name ];
  if (cfg.pt !== 'auto') parts.push(PAGETYPES.find(p => p.k === cfg.pt).name);
  return parts.join(' · ');
}

const cfgRowEl = document.getElementById('cfgRow');
const cfgMenuEl = document.getElementById('cfgMenu');

function renderCfgRow(id){
  const cfg = cfgOf(id);
  const pills = [
    { key:'fw',   icon:ICONS.fw,       label:FRAMEWORKS.find(f => f.k === cfg.fw).name },
    { key:'side', icon:ICONS.side,     label:SIDES.find(s => s.k === cfg.side).name },
    { key:'ds',   icon:dsIcon(cfg.ds), label:DS_MAP[cfg.ds].name },
    { key:'pt',   icon:ICONS.pt,       label:PAGETYPES.find(p => p.k === cfg.pt).name },
  ];
  cfgRowEl.innerHTML = pills.map(p => `<div class="cfg-pill" data-key="${p.key}">${p.icon}<span>${p.label}</span><span class="caret">${mi('dropdown', 15)}</span></div>`).join('');
  cfgRowEl.querySelectorAll('.cfg-pill').forEach(el => {
    el.onclick = e => { e.stopPropagation(); openCfgMenu(id, el.dataset.key, el); };
  });
}

function openCfgMenu(id, key, anchor){
  const cfg = cfgOf(id);
  let items;
  if (key === 'fw')        items = FRAMEWORKS.map(f => ({ k:f.k, name:f.name, icon:ICONS.fw, on:cfg.fw === f.k }));
  else if (key === 'side') items = SIDES.map(s => ({ k:s.k, name:s.name, icon:ICONS.side, on:cfg.side === s.k }));
  else if (key === 'ds')   items = DESIGN_SYSTEMS.map(d => ({ k:d.k, name:d.name, icon:dsIcon(d.k), on:cfg.ds === d.k }));
  else                     items = PAGETYPES.map(p => ({ k:p.k, name:p.name, icon:ICONS.pt, on:cfg.pt === p.k }));
  cfgMenuEl.innerHTML = items.map(i => `<div class="cm-item${i.on ? ' on' : ''}" data-k="${i.k}">${i.icon}<span>${i.name}</span></div>`).join('');
  const dRect = drawer.getBoundingClientRect(), aRect = anchor.getBoundingClientRect();
  cfgMenuEl.style.left = Math.max(8, Math.min(aRect.left - dRect.left, drawer.clientWidth - 216)) + 'px';
  cfgMenuEl.style.top = (aRect.bottom - dRect.top + 6) + 'px';
  cfgMenuEl.classList.add('show');
  cfgMenuEl.querySelectorAll('.cm-item').forEach(el => {
    el.onclick = e => { e.stopPropagation(); cfgMenuEl.classList.remove('show'); setCfg(id, key, el.dataset.k); };
  });
}
document.addEventListener('click', () => cfgMenuEl.classList.remove('show'));

function setCfg(id, key, val){
  const cfg = cfgOf(id);
  if (cfg[key] === val) return;
  cfg[key] = val;
  // 端类型与设计系统双向联动
  if (key === 'side'){
    const ds = DS_MAP[cfg.ds];
    if (ds.side && ds.side !== val){
      const alt = DESIGN_SYSTEMS.find(d => d.side === val);
      if (alt){ cfg.ds = alt.k; toast(`已自动切换设计系统为「${alt.name}」`); }
    }
  }
  if (key === 'ds'){
    const ds = DS_MAP[val];
    if (ds.side && ds.side !== cfg.side){
      cfg.side = ds.side;
      toast(`「${ds.name}」为 ${ds.side === 'b' ? 'B' : 'C'} 端设计系统，已同步切换端类型`);
    }
  }
  renderCfgRow(id);
  if (state.pages[id]){
    const spec = buildSpec(nodeById(id), state.descs[id] || '', cfg);
    state.pages[id] = spec;
    renderPhone(id, true);
    renderFlow();
    selectHighlight(id);
    pushMsg(id, 'ai', `已按 <span class="hl">${cfgSummary(cfg)}</span> 重新生成页面，右侧预览已更新。`);
    renderChat(id);
    renderQchips(id);
  } else {
    renderPhone(id, false);
  }
}

function resolvePrimary(spec){

function injectDelay(html, i){
  return html.replace(/class="comp([^"]*)" style="/, (s, g) => `class="comp${g}" style="--cd:${i * 0.08}s;`);
}

function renderPageBody(spec, animated){
  const p = resolvePrimary(spec);

    const fn = DS[c.type];

  return `<div class="pg${animated ? '' : ' noanim'}${wire}" style="--p:${p}">
    <div style="display:flex;justify-content:space-between;padding:7px 18px 3px;font-size:10.5px;font-weight:700;flex-shrink:0;background:${spec.comps[0] && ['navbar','search'].includes(spec.comps[0].type) ? 'var(--card)' : 'transparent'}"><span>9:41</span><span style="display:inline-flex;gap:4px;align-items:center;line-height:0">${mi('signal', 11)}${mi('battery', 13)}</span></div>

}

function applyThemeFromText(spec, text){
  if (/橙/.test(text)) spec.theme = 'orange';
  else if (/绿/.test(text)) spec.theme = 'green';
  else if (/红/.test(text)) spec.theme = 'red';
  else if (/紫/.test(text)) spec.theme = 'purple';
  else if (/蓝/.test(text)) spec.theme = 'blue';
}

/* 迭代修改指令 */
function tryModify(spec, text){
  const changes = [];
  const themed = /[橙绿红紫蓝]/.test(text) && /色|主题/.test(text);
  if (themed){
    applyThemeFromText(spec, text);
    changes.push('主题色切换为' + THEMES[spec.theme].name);
  }
  const addMapC = [
    [/轮播|banner|横幅|广告位/i, { type:'banner', title:'限时活动', subtitle:'新用户专享，立省 180 元', btn:'去看看' }, '活动 Banner', 1],
    [/公告|通知/, { type:'notice', text:'系统公告：服务升级，体验更流畅' }, '公告栏', 1],
    [/优惠券|券/, { type:'coupon' }, '优惠券卡片', 1],
    [/步骤|进度条/, { type:'steps', items:['第一步','第二步','第三步'], active:1 }, '步骤条', 1],
    [/客服/, { type:'cards', items:[{icon:'headset', title:'在线客服', desc:'7×24 小时为您服务'}] }, '客服入口', 0],
    [/表单|输入/, { type:'form', fields:[{label:'新增字段', placeholder:'请输入'}] }, '表单区块', 0],
  ];
  const addMapB = [
    [/统计|数据卡|指标/, { type:'bstats', items:[{label:'新增指标',value:'1,024',trend:'+9%'},{label:'环比',value:'86%',trend:'+3%'},{label:'转化率',value:'32.5%',trend:'+1.2%'},{label:'异常数',value:'3',trend:'-40%'}] }, '统计卡片', 1],
    [/页签|tab/i, { type:'btabs', items:['全部','进行中','已完成'], on:0 }, '页签', 1],
    [/筛选|搜索/, { type:'bfilter', fields:['关键词','状态','时间'] }, '筛选栏', 1],
    [/表单|输入/, { type:'bform', fields:[{label:'新增字段', val:'请输入'}] }, '表单面板', 0],
  ];
  const addMap = spec.mode === 'b' ? addMapB : addMapC;
  const btnType = spec.mode === 'b' ? 'bfoot' : 'button';
  if (/加|添加|新增|放一个|来一个/.test(text)){
    for (const [re, comp, name, atTop] of addMap){
      if (re.test(text)){
        const idx = spec.comps.findIndex(c => c.type === btnType);
        const insertAt = atTop ? Math.min(1, spec.comps.length) : (idx === -1 ? spec.comps.length : idx);
        spec.comps.splice(insertAt, 0, JSON.parse(JSON.stringify(comp)));
        changes.push('新增「' + name + '」组件');
        break;
      }
    }
  }
  if (/去掉|删除|移除/.test(text)){
    const delMap = [ [/轮播|banner|横幅/i, 'banner', 'Banner'], [/公告/, 'notice', '公告栏'], [/券/, 'coupon', '优惠券'], [/步骤/, 'steps', '步骤条'], [/搜索/, 'search', '搜索框'] ];
    for (const [re, type, name] of delMap){
      if (re.test(text)){
        const i = spec.comps.findIndex(c => c.type === type);
        if (i > -1){ spec.comps.splice(i, 1); changes.push('移除「' + name + '」组件'); }
        break;
      }
    }
  }
  const tm = text.match(/标题(?:改成|改为|换成)[「"']?([^」"'，。]+)/);
  if (tm){
    const nav = spec.comps.find(c => c.type === 'navbar');
    if (nav) nav.title = tm[1];
    spec.title = tm[1];
    changes.push('标题更新为「' + tm[1] + '」');
  }
  return changes;
}

  document.getElementById('dType').textContent = TYPE_NAME[n.type];
  // 设 --c 让方点的底色与霓虹外发光同步（.n-dot 的 box-shadow 读 --c）
  document.getElementById('dDot').style.setProperty('--c', TYPE_COLOR[n.type]);
  drawer.classList.add('open');

  if (!state.chats[id]){
    state.chats[id] = [];
    pushMsg(id, 'ai', `这是<span class="hl">「${esc(n.title)}」</span>节点。\n${esc(n.desc || '')}\n\n可先在上方选择<span class="hl">框架 / 端类型 / 设计系统 / 页面类型</span>，然后点击下方按钮直接生成页面，或先描述你的具体需求。`);
  }
  renderCfgRow(id);
  renderChat(id);
  renderPhone(id, false);
  renderQchips(id);
}

function closeDrawer(){
  drawer.classList.remove('open');
  if (typeof cfgMenuEl !== 'undefined') cfgMenuEl.classList.remove('show');
  state.selectedId = null;
  nodeLayer.querySelectorAll('.node').forEach(el => el.classList.remove('selected'));
}
document.getElementById('dClose').onclick = closeDrawer;

function pushMsg(id, role, html){
  state.chats[id].push({ role, html });
}

function renderChat(id){
  chatScroll.innerHTML = state.chats[id].map(m => `
    <div class="msg ${m.role}">
      <div class="ava">${m.role === 'ai' ? mi('robot', 17) : mi('person', 17)}</div>
      <div class="bub">${m.html}</div>
    </div>`).join('');
  chatScroll.scrollTop = chatScroll.scrollHeight;
}

function renderQchips(id){
  const spec = state.pages[id];
  const hasPage = !!spec;
  const chips = hasPage
    ? (spec.mode === 'b'
        ? ['换成蓝色主题', '加一组统计卡片', '加一个页签', '换成绿色主题']
        : ['换成橙色主题', '加一个活动 banner', '加一张优惠券', '换成绿色主题'])
    : ['直接生成该页面', '页面要突出安全感和信任感', '风格年轻化一点'];
  qchipsEl.innerHTML = chips.map((c, i) => `<button class="qchip ${!hasPage && i === 0 ? 'primary' : ''}" data-t="${c}">${!hasPage && i === 0 ? mi('spark', 15) : ''}<span>${c}</span></button>`).join('');
  qchipsEl.querySelectorAll('.qchip').forEach(b => b.onclick = () => sendChat(b.dataset.t));
}

function renderPhone(id, animated){
  const spec = state.pages[id];
  const cfg = cfgOf(id);
  const isB = spec ? spec.mode === 'b' : cfg.side === 'b';
  const ds = DS_MAP[cfg.ds];
  document.getElementById('pcTitle').textContent = '页面预览 · ' + (spec ? (spec.dsName || ds.name) : ds.name) + ' 实时渲染';
  const inner = spec
    ? renderPageBody(spec, animated)
    : `<div class="ph-empty"><div class="pe-ic">${mi('palette', 36)}</div><p>还没有生成页面<br>在左侧对话描述需求即可生成</p></div>`;
  if (isB){
    deviceWrap.innerHTML = `<div class="dtop"><div class="dbar"><i></i><i></i><i></i><span class="durl">ops.didi.cn/console</span></div><div class="screen dscreen">${inner}</div></div>`;
  } else {
    deviceWrap.innerHTML = `<div class="phone"><div class="screen">${inner}</div></div>`;
  }
  document.getElementById('btnFullPage').style.display = spec ? 'inline-flex' : 'none';
}

/* 完整页面展示弹窗 */
const pageModal = document.getElementById('pageModal');
function openPageModal(id){
  const spec = state.pages[id];
  if (!spec) return;
  const n = nodeById(id);
  const cfg = cfgOf(id);
  document.getElementById('pmTitle').textContent = (n ? n.title : spec.title) + ' · 完整页面';
  document.getElementById('pmSub').textContent = cfgSummary(cfg) + ' · ' + spec.comps.length + ' 个组件 · ' + (spec.dsName || '');
  const body = document.getElementById('pmBody');
  if (spec.mode === 'b'){
    body.innerHTML = `<div class="fp-wrap"><div class="fp-device b"><div class="dbar"><i></i><i></i><i></i><span class="durl">ops.didi.cn/console</span></div>${renderPageBody(spec, false)}</div></div>`;
  } else {
    body.innerHTML = `<div class="fp-wrap"><div class="fp-device">${renderPageBody(spec, false)}</div></div>`;
  }
  document.getElementById('pmEdit').onclick = () => { pageModal.classList.remove('show'); selectNode(id); };
  pageModal.classList.add('show');
}
document.getElementById('pmClose').onclick = () => pageModal.classList.remove('show');
pageModal.addEventListener('mousedown', e => { if (e.target === pageModal) pageModal.classList.remove('show'); });
document.getElementById('btnFullPage').onclick = () => { if (state.selectedId) openPageModal(state.selectedId); };

let chatBusy = false;
async function sendChat(text){
  const id = state.selectedId;
  if (!id || chatBusy) return;
  const n = nodeById(id);
  chatBusy = true;
  document.getElementById('chatSend').disabled = true;

  pushMsg(id, 'me', esc(text));
  renderChat(id);
  qchipsEl.innerHTML = '';

  // typing 指示
  chatScroll.insertAdjacentHTML('beforeend', `<div class="msg ai" id="typingMsg"><div class="ava">${mi('robot', 17)}</div><div class="bub"><span class="typing"><i></i><i></i><i></i></span></div></div>`);
  chatScroll.scrollTop = chatScroll.scrollHeight;
  await wait(700);

  const cfg = cfgOf(id);
  const existing = state.pages[id];
  let reply;
  if (existing){
    const spec = JSON.parse(JSON.stringify(existing));
    const changes = tryModify(spec, text);
    if (changes.length){
      state.pages[id] = spec;
      reply = `已更新页面\n${changes.map(c => '· ' + c).join('\n')}\n\n右侧预览已同步刷新，还可以继续调整。`;
    } else {
      const spec2 = buildSpec(n, text, cfg);
      spec2.theme = existing.theme;
      state.pages[id] = spec2;
      state.descs[id] = text;
      reply = `已根据新描述<span class="hl">重新生成</span>页面\n使用了 ${spec2.comps.length} 个设计系统组件，右侧预览已更新。`;
    }
  } else {
    await wait(500);
    const spec = buildSpec(n, text, cfg);
    state.pages[id] = spec;
    state.descs[id] = text;
    const names = { navbar:'导航栏', search:'搜索框', banner:'Banner', notice:'公告栏', grid:'金刚位', steps:'步骤条', cards:'卡片列表', plans:'方案对比卡', form:'表单', info:'信息明细', amount:'金额展示', paylist:'支付方式', agreement:'协议勾选', button:'主按钮', result:'结果反馈', coupon:'优惠券', progress:'进度状态', tabbar:'底部导航',
      bstats:'统计卡片', bfilter:'筛选栏', btable:'数据表格', bpager:'分页器', bform:'表单面板', bfoot:'操作按钮', bdesc:'信息描述', btabs:'页签' };
    const used = [...new Set(spec.comps.map(c => names[c.type] || c.type))];
    const hint = spec.mode === 'b'
      ? `可以继续对话调整，比如<span class="hl">"换成蓝色主题"</span>、<span class="hl">"加一组统计卡片"</span>。`
      : `可以继续对话调整，比如<span class="hl">"换成橙色主题"</span>、<span class="hl">"加一个活动 banner"</span>。`;
    reply = `页面已生成（${cfgSummary(cfg)}）\n\n调用<span class="hl">${spec.dsName}</span>设计系统组装了 <span class="hl">${spec.comps.length} 个组件</span>：\n${used.map(u => '· ' + u).join('\n')}\n\n${hint}`;
  }

  document.getElementById('typingMsg')?.remove();
  pushMsg(id, 'ai', reply);
  renderChat(id);
  renderPhone(id, true);
  renderQchips(id);
  renderFlow();           // 刷新节点缩略图 & 徽标
  selectHighlight(id);
  chatBusy = false;
  document.getElementById('chatSend').disabled = false;
}

function selectHighlight(id){
  nodeLayer.querySelectorAll('.node').forEach(el => el.classList.toggle('selected', el.dataset.id === id));
}

document.getElementById('chatSend').onclick = () => {
  const inp = document.getElementById('chatInput');
  const v = inp.value.trim();
  if (!v) return;
  inp.value = '';
  sendChat(v);
};
document.getElementById('chatInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('chatSend').click();
});

/* ============================================================
   知识库：链路沉淀与复用（localStorage 持久化）
============================================================ */
const KB_KEY = 'flowcraft_kb';
function kbAll(){ try { return JSON.parse(localStorage.getItem(KB_KEY)) || []; } catch(e){ return []; } }
function kbWrite(list){ localStorage.setItem(KB_KEY, JSON.stringify(list)); updateKbCount(); }
function updateKbCount(){ document.getElementById('kbCount').textContent = kbAll().length; }

const kbModal = document.getElementById('kbModal');
const saveModal = document.getElementById('saveModal');

document.getElementById('btnSaveKb').onclick = () => {
  if (!state.flow){ toast('画布还是空的，先生成一条链路吧'); return; }
  const pageCount = Object.keys(state.pages).length;
  document.getElementById('saveMeta').textContent = `将保存：${state.flow.nodes.length} 个节点 · ${state.flow.edges.length} 条链路 · ${pageCount} 个已生成页面（含各节点配置与对话记录）`;
  document.getElementById('saveName').value = state.flowName || '未命名链路';
  saveModal.classList.add('show');
  document.getElementById('saveName').select();
};
document.getElementById('btnSaveCancel').onclick = () => saveModal.classList.remove('show');
document.getElementById('btnSaveGo').onclick = () => {
  const name = document.getElementById('saveName').value.trim() || '未命名链路';
  const list = kbAll();
  list.unshift({
    id: 'kb' + Date.now(),
    name,
    savedAt: new Date().toLocaleString('zh-CN', { month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' }),
    flow: state.flow, pages: state.pages, configs: state.configs, descs: state.descs, chats: state.chats,
  });
  kbWrite(list);
  saveModal.classList.remove('show');
  toast(`已存入知识库：「${name}」`);
};
document.getElementById('saveName').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('btnSaveGo').click(); });

document.getElementById('btnOpenKb').onclick = openKb;
document.getElementById('btnKbClose').onclick = () => kbModal.classList.remove('show');
function openKb(){
  const list = kbAll();
  const el = document.getElementById('kbList');
  el.innerHTML = list.length ? list.map(item => `
    <div class="kb-card" data-id="${item.id}">
      <button class="kb-del" data-id="${item.id}" title="删除">${mi('del', 15)}</button>
      <b>${esc(item.name)}</b>
      <div class="kb-meta"><span>${mi('tree', 13)}${item.flow.nodes.length} 节点</span><span>${mi('smartphone', 13)}${Object.keys(item.pages || {}).length} 页面</span><span>${mi('schedule', 13)}${esc(item.savedAt)}</span></div>
      <div class="kb-tags">${item.flow.nodes.slice(0, 5).map(n => `<span class="kb-tag">${esc(n.title)}</span>`).join('')}${item.flow.nodes.length > 5 ? `<span class="kb-tag">+${item.flow.nodes.length - 5}</span>` : ''}</div>
    </div>`).join('')
    : `<div class="kb-empty"><div style="margin-bottom:8px;opacity:.7">${mi('inbox', 34)}</div>知识库还是空的<br>生成链路后点击「存入知识库」进行沉淀</div>`;
  el.querySelectorAll('.kb-del').forEach(b => b.onclick = e => {
    e.stopPropagation();
    kbWrite(kbAll().filter(x => x.id !== b.dataset.id));
    openKb();
  });
  el.querySelectorAll('.kb-card').forEach(c => c.onclick = () => loadKb(c.dataset.id));
  kbModal.classList.add('show');
}
function loadKb(id){
  const item = kbAll().find(x => x.id === id);
  if (!item) return;
  state.flow = item.flow;
  state.pages = item.pages || {};
  state.configs = item.configs || {};
  state.descs = item.descs || {};
  state.chats = item.chats || {};
  state.flowName = item.name;
  state.selectedId = null;
  kbModal.classList.remove('show');
  document.getElementById('empty').style.display = 'none';
  closeDrawer();
  renderFlow(true);
  fitView();
  toast(`已载入「${item.name}」，点击节点可继续编辑`);
}
kbModal.addEventListener('mousedown', e => { if (e.target === kbModal) kbModal.classList.remove('show'); });
saveModal.addEventListener('mousedown', e => { if (e.target === saveModal) saveModal.classList.remove('show'); });
updateKbCount();

document.addEventListener('keydown', e => {
  if (e.key === 'Escape'){ prdModal.classList.remove('show'); kbModal.classList.remove('show'); saveModal.classList.remove('show'); pageModal.classList.remove('show'); closeDrawer(); }
});

/* 启动：把 data-mi 占位替换成内联 SVG 图标 */
document.querySelectorAll('[data-mi]').forEach(el => { el.innerHTML = mi(el.dataset.mi, +(el.dataset.size || 18)); });

applyTransform();
</script>
</body>
</html>
